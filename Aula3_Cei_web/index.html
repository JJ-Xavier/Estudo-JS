<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo de Formulário com JavaScript</title>
    <link rel="stylesheet" href="css/index.css">
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <div>
        <h1>Calculadora de Quadrado</h1>
        <form id="numeroForm">
        <label for="numero">Digite um número:</label>
        <input type="number" id="numero" name="numero" required />
        <button type="submit">Calcular Quadrado</button>
        </form>
    <p>O resultado é: <span id="resultado"></span></p>
    </div>
    <div>
        <h1> Calculadora de Cubo </h1>
        <form id="numeroFormcubo">
        <label for="numerocubo">Digite um número:</label>
        <input type="numbercubo" id="numerocubo" name="numerocubo" required />
        <button type="submit">Calcular Cubo</button>
        </form>
    <p> O resultado é: <span id="resultadocubo"></span></p>
    </div>
  </body>
</html>
